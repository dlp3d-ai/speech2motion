name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: dockersenseyang/dlp3d_speech2motion:latest
      options: --entrypoint ""
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Download files
      run: |
        mkdir -p input
        cd input
        curl -LjO https://github.com/LazyBusyYang/CatStream/releases/download/s2m_cicd_files/gpt_4o_responses.txt
        cd ..
        wget https://github.com/LazyBusyYang/CatStream/releases/download/s2m_cicd_files/local_mdb_pytest.tar.gz
        tar -xzf local_mdb_pytest.tar.gz && rm local_mdb_pytest.tar.gz
        ls -la
    - name: Run tests
      run: |
        pwd
        /opt/venv/bin/pip install . && PYTHONPATH=/__w/speech2motion/speech2motion /opt/venv/bin/python -m pytest tests --log-cli-level=ERROR
    - name: Cat pytest log
      run: |
        cat logs/pytest.log
